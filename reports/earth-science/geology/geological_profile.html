<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지질 단면 실험실</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
:root{color-scheme:dark;
  --paper:#0c0e12; --surface:#171a20; --sunk:#1e222b;
  --ink:#e8eaee; --body:#b4b9c4; --faint:#8b909b;
  --line:#2a2e37; --line-soft:#22262b;
  --sea:#6fb3e6; --sea-soft:rgba(111,179,230,.14);
  --coral:#e06a5b; --teal:#7dd3c8;
  --sans:'Pretendard','Pretendard Variable',-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;
  letter-spacing:-.01em;word-break:keep-all;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,select,input,textarea{font-family:var(--sans);color:inherit;letter-spacing:-.01em}
button{cursor:pointer}
h1,h2,h3{margin:0;letter-spacing:-.025em;line-height:1.4}

.sheet{max-width:1320px;margin:0 auto;background:var(--surface);min-height:100vh;
  border-left:1px solid var(--line);border-right:1px solid var(--line);display:flex;flex-direction:column}
@media(max-width:820px){.sheet{border:0}}

/* ---- 머리글 ---- */
header.top{background:#101216;color:#e8eaee;padding:1.4rem 2.4rem;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:1rem}
header.top .titles{flex:1;min-width:0}
header.top .kicker{font-size:.88rem;font-weight:600;color:var(--sea);margin-bottom:.1rem}
header.top h1{font-size:1.4rem;font-weight:700;color:#fff;letter-spacing:-.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:.5rem;align-items:center}
.tb{font-size:.9rem;font-weight:700;padding:.55rem 1.1rem;border-radius:999px;border:1.5px solid #39404b;
  background:var(--surface);color:var(--ink);transition:.16s;white-space:nowrap}
.tb:hover{background:var(--sea-soft);border-color:var(--sea)}
#btn-help{width:2.4rem;padding:.55rem 0;text-align:center}
@media(max-width:700px){header.top{padding:1.1rem 1.2rem}header.top h1{font-size:1.15rem}header.top .kicker{font-size:.8rem}}
@media(max-width:560px){.tb .lbl{display:none}.tb{padding:.5rem .8rem}}
.menu{position:relative}
.menu-list{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 48px rgba(0,0,0,.5);padding:6px;min-width:230px;display:none;z-index:40}
.menu-list.open{display:block}
.menu-list button{display:block;width:100%;text-align:left;background:none;border:0;padding:.6rem .8rem;border-radius:9px;font-size:.95rem;color:var(--body)}
.menu-list button:hover{background:var(--sea-soft);color:var(--ink)}
.menu-list hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* ---- 그림판식 도구 막대 ---- */
.workbench{display:grid;grid-template-columns:84px minmax(0,1fr)}
#tabs{display:flex;flex-direction:column;gap:6px;padding:12px 10px;background:var(--surface);border-right:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border:1.5px solid transparent;
  border-radius:12px;background:none;color:var(--body);font-size:.76rem;font-weight:600;line-height:1.2;transition:.14s;position:relative}
.tab svg{width:30px;height:30px;display:block}
.tab:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.tab.on{background:var(--sea-soft);border-color:var(--sea);color:var(--sea)}
.tab .key{position:absolute;top:4px;right:6px;font-size:.62rem;color:var(--faint);font-weight:500}
.tab.on .key{color:var(--sea)}
@media(max-width:640px){
  .workbench{grid-template-columns:1fr}
  #tabs{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px;scrollbar-width:none}
  #tabs::-webkit-scrollbar{display:none}
  #tabs{gap:3px;padding:6px}
  .tab{flex:1 1 0;min-width:0;padding:8px 2px 6px;font-size:.68rem;letter-spacing:-.04em;white-space:nowrap}
  .tab svg{width:24px;height:24px}
  .tab .key{display:none}
}

/* ---- 캔버스 아래 도구 설정 ---- */
.settings{border-top:1px solid var(--line);background:var(--sunk);border-radius:0 0 14px 14px}
.settings-head{display:flex;align-items:center;gap:.7rem;padding:.85rem 1.1rem 0}
.settings-head .tool-ic{width:30px;height:30px;border-radius:9px;background:var(--sea-soft);color:var(--sea);display:grid;place-items:center;flex:none}
.settings-head .tool-ic svg{width:20px;height:20px}
.settings-head h3{font-size:1.05rem;font-weight:700;color:var(--sea)}
.settings .hint{border-top:0;padding:.35rem 1.1rem 0}

/* ---- 본문 배치 ---- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:2rem;padding:2rem 2.4rem 2.4rem;flex:1;align-items:start}
@media(max-width:1000px){.layout{grid-template-columns:1fr;gap:1.4rem;padding:1.4rem 1.2rem 2rem}}
.board{display:flex;flex-direction:column;gap:1.6rem;min-width:0}
.side{display:flex;flex-direction:column;gap:1rem;min-width:0;position:sticky;top:16px}
@media(max-width:1000px){.side{position:static}}

.card{background:var(--sunk);border:1px solid var(--line);border-radius:14px}
.card-head{display:flex;align-items:center;gap:.6rem;padding:.9rem 1.1rem;border-bottom:1px solid var(--line)}
.card-head h2{font-size:1.08rem;font-weight:600;color:var(--sea);flex:1;display:flex;align-items:baseline;gap:.6rem;min-width:0}
.card-head h2 .n{font-size:.78rem;color:var(--faint);font-weight:500;letter-spacing:.06em}
.card-head h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:560px){.card-head{padding:.8rem .9rem;gap:.4rem}.card-head h2 .n{display:none}.card-head h2{font-size:1rem}.ib{width:32px;height:32px}}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  display:inline-grid;place-items:center;font-size:1rem;transition:.14s;flex:none}
.ib:hover:not(:disabled){background:var(--sea-soft);border-color:var(--sea)}
.ib:disabled{opacity:.3;cursor:default}
.chk{display:flex;align-items:center;gap:.45rem;font-size:.88rem;color:var(--body);user-select:none;cursor:pointer;white-space:nowrap}
.chk input{width:17px;height:17px;accent-color:var(--sea);cursor:pointer;margin:0}

.stage{position:relative;padding:28px;touch-action:none;user-select:none;-webkit-user-select:none;
  background:repeating-linear-gradient(45deg,#1a1e25 0 6px,#20242c 6px 12px)}
@media(max-width:640px){.stage{padding:16px}}
.wrap{position:relative;width:100%;aspect-ratio:800/520;background:#e7f0f5;border-radius:4px;
  box-shadow:0 0 0 1px #3a414c,0 10px 30px rgba(0,0,0,.35);overflow:hidden}
.wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hint{font-size:.92rem;color:var(--faint);padding:.8rem 1.1rem 1rem;line-height:1.65;border-top:1px solid var(--line)}

/* ---- 목표 단면 ---- */
.target .body{padding:1.1rem;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1.2rem;align-items:start}
.target .side-info{display:flex;flex-direction:column;gap:.8rem}
.target .desc{font-size:.95rem;color:var(--body);margin:0;line-height:1.7;
  background:var(--surface);border-left:3px solid var(--sea);border-radius:0 10px 10px 0;padding:.8rem 1rem}
@media(max-width:760px){.target .body{grid-template-columns:1fr}}
#overlay-alpha{width:100%}

/* ---- 버튼 ---- */
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.btn{font-size:.95rem;font-weight:700;padding:.62rem 1.3rem;border-radius:999px;border:1.5px solid #39404b;
  background:var(--surface);color:var(--ink);transition:.16s}
.btn:hover{background:var(--sea-soft)}
.btn.primary{background:var(--sea);color:#0c0e12;border-color:var(--sea)}
.btn.primary:hover{background:#8cc3ec;border-color:#8cc3ec}
.btn.small{padding:.42rem .95rem;font-size:.86rem}
.btn.danger{color:#f0a99e;border-color:rgba(224,106,91,.45)}
.btn.danger:hover{background:rgba(224,106,91,.12)}

/* ---- 도구 설정 패널 ---- */
.side-head{display:flex;align-items:baseline;gap:.6rem;padding:.9rem 1.1rem;border-bottom:1px solid var(--line)}
.side-head h3{font-size:1.08rem;font-weight:600;color:var(--sea)}
.side-head .n{font-size:.78rem;color:var(--faint);font-weight:500;letter-spacing:.06em}
.panel{padding:.9rem 1.1rem 1.2rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.9rem 1.4rem;align-items:end}
.panel>.note,.panel>.editing-badge{grid-column:1/-1}
.panel>.btn{justify-self:start;align-self:end}
.field{display:flex;flex-direction:column;gap:.45rem}
.field>label,.flabel{font-size:.78rem;color:var(--faint);font-weight:600;letter-spacing:.08em}
.field select,.editor select{width:100%;padding:.6rem .8rem;border-radius:12px;border:1.5px solid var(--line);
  background:var(--paper);color:var(--ink);font-size:.98rem;transition:.14s}
select:focus,input[type=text]:focus,textarea:focus{outline:none;border-color:var(--sea);box-shadow:0 0 0 3px var(--sea-soft)}
.seg{display:flex;flex-wrap:wrap;gap:3px;background:var(--paper);padding:4px;border-radius:12px;border:1.5px solid var(--line)}
.seg button{flex:1;border:0;background:none;padding:.48rem .4rem;border-radius:9px;font-size:.9rem;color:var(--body);white-space:nowrap;transition:.14s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--sea-soft);color:var(--sea);font-weight:700}
.slider{display:grid;grid-template-columns:1fr auto;gap:.25rem .6rem;align-items:center}
.slider .sl-name{font-size:.82rem;color:var(--body);font-weight:600}
.slider .sl-val{font-size:.85rem;font-variant-numeric:tabular-nums;color:var(--sea);font-weight:600}
.slider input{grid-column:1/-1;width:100%;accent-color:var(--sea);margin:.1rem 0}
.swatch{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid rgba(255,255,255,.25);vertical-align:-2px;margin-right:.45rem;flex:none}
.note{font-size:.9rem;color:var(--body);line-height:1.75;margin:0;
  background:var(--surface);border-left:3px solid var(--sea);border-radius:0 10px 10px 0;padding:.8rem 1rem}
.note b{color:var(--ink);font-weight:600}
.editing-badge{font-size:.86rem;font-weight:600;background:rgba(224,106,91,.1);color:#f0a99e;
  border-left:3px solid var(--coral);border-radius:0 8px 8px 0;padding:.55rem .8rem}

/* ---- 작업 기록 · 정답 ---- */
details.card>summary{list-style:none;cursor:pointer;padding:.9rem 1.1rem;display:flex;align-items:center;gap:.6rem;
  font-weight:600;font-size:1.05rem;color:var(--sea)}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"▾";margin-left:auto;color:var(--faint);transition:transform .15s}
details.card[open]>summary{border-bottom:1px solid var(--line)}
details.card[open]>summary::after{transform:rotate(180deg)}
.count{font-size:.78rem;font-weight:600;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:.05rem .65rem;color:var(--faint)}
.tl{list-style:none;margin:0;padding:.5rem;display:flex;flex-direction:column;gap:2px;max-height:340px;overflow:auto}
.tl li{display:flex;align-items:center;gap:.6rem;padding:.45rem .6rem;border-radius:9px;font-size:.92rem;color:var(--body);cursor:pointer}
.tl li:hover{background:rgba(255,255,255,.04);color:var(--ink)}
.tl li.sel{background:var(--sea-soft);color:var(--ink)}
.tl .no{width:24px;height:24px;border-radius:7px;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font-size:.74rem;color:var(--faint);flex:none}
.tl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl .x{border:0;background:none;color:var(--faint);font-size:.95rem;padding:2px 7px;border-radius:6px}
.tl .x:hover{background:rgba(224,106,91,.14);color:var(--coral)}
.editor{margin:0 .8rem .9rem;padding:1rem;border:1.5px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;gap:.85rem;background:var(--surface)}
.answer{padding:1rem 1.1rem 1.2rem}
.answer .seq{font-size:1.05rem;line-height:2;font-weight:700;word-break:keep-all;color:var(--ink)}
.answer .seq .ar{color:var(--faint);font-weight:400;margin:0 .3rem}
.answer .seq .hid{color:var(--faint);font-weight:400;font-size:.82rem}
.answer ol{margin:.6rem 0 0;padding-left:1.3rem;font-size:.9rem;line-height:1.8;color:var(--body)}
.target .answer{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem!important}

/* ---- 모달 ---- */
.modal-bg{position:fixed;inset:0;background:rgba(6,8,10,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:1.2rem}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;max-width:760px;width:100%;max-height:88vh;overflow:auto;
  box-shadow:0 24px 60px rgba(0,0,0,.55);animation:zoomIn .22s cubic-bezier(.16,1,.3,1)}
@keyframes zoomIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal header{display:flex;align-items:center;padding:1rem 1.2rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal header h3{font-size:1.12rem;font-weight:700;flex:1;color:var(--ink)}
.modal .mbody{padding:1.2rem;display:flex;flex-direction:column;gap:.9rem}
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.9rem}
.ex-item{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sunk);text-align:left;padding:0;display:flex;flex-direction:column;color:var(--ink);transition:.16s}
.ex-item:hover{border-color:var(--sea);transform:translateY(-2px)}
.ex-item canvas{width:100%;aspect-ratio:800/520;display:block;background:#e7f0f5}
.ex-item .t{padding:.7rem .85rem .1rem;font-weight:700;font-size:.98rem}
.ex-item .d{padding:0 .85rem .85rem;font-size:.84rem;color:var(--faint);line-height:1.55}
.help h4{margin:.7rem 0 .2rem;font-size:1rem;color:var(--sea);font-weight:600}
.help h4:first-child{margin-top:0}
.help ul{margin:0;padding-left:1.2rem;line-height:1.8;font-size:.94rem;color:var(--body)}
.help b{color:var(--ink)}
textarea.code{width:100%;min-height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
  border:1.5px solid var(--line);border-radius:12px;padding:.8rem;background:var(--paper);color:var(--body)}
input[type=text]{width:100%;padding:.65rem .8rem;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font-size:.98rem}
input[type=text]::placeholder{color:#6f747f}
code{background:var(--paper);padding:.05rem .35rem;border-radius:5px;font-size:.9em}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#101216;color:var(--ink);
  border:1px solid var(--line);border-left:3px solid var(--sea);padding:.7rem 1.1rem;border-radius:10px;font-size:.94rem;
  opacity:0;transition:.2s;pointer-events:none;z-index:60;max-width:90vw;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---- 꼬리말 ---- */
.site-footer{padding:1.3rem 2.4rem 1.6rem;background:var(--paper);border-top:1px solid var(--line);text-align:center}
.site-footer p{margin:0;font-size:12px;color:var(--faint);line-height:1.6}
@media(max-width:700px){.site-footer{padding:1.1rem 1.2rem 1.4rem}}
</style>
</head>
<body>
<div class="sheet">
<header class="top">
  <div class="titles">
    <div class="kicker">지구과학 탐구활동 (지질·지사학)</div>
    <h1 id="app-title">지질 단면 실험실</h1>
  </div>
  <div class="actions">
    <button class="tb" id="btn-examples">📚<span class="lbl"> 예제</span></button>
    <div class="menu">
      <button class="tb" id="btn-file">💾<span class="lbl"> 파일</span></button>
      <div class="menu-list" id="file-menu">
        <button data-act="png">PNG 이미지로 저장</button>
        <button data-act="json">작업 파일(.json) 저장</button>
        <button data-act="open">작업 파일 불러오기</button>
        <hr>
        <button data-act="excode">예제 코드 만들기 (교사용)</button>
        <button data-act="totarget">현재 그림을 목표 단면으로 보기</button>
      </div>
    </div>
    <button class="tb" id="btn-help" title="사용 방법">?</button>
  </div>
  <input type="file" id="file-input" accept=".json,application/json" hidden>
</header>


<main class="layout">
  <section class="board">
    <div class="card target" id="target-card" hidden>
      <div class="card-head">
        <h2><span class="n">TARGET</span>목표 단면 · <span id="target-title"></span></h2>
        <button class="ib" id="target-close" title="목표 단면 닫기">✕</button>
      </div>
      <div class="body">
        <div class="wrap"><canvas id="target-canvas"></canvas></div>
        <div class="side-info">
          <p class="desc" id="target-desc"></p>
          <button class="btn primary" id="target-answer-btn">정답 순서 보기</button>
          <label class="chk"><input type="checkbox" id="overlay-chk"> 내 캔버스에 겹쳐 보기</label>
          <input type="range" id="overlay-alpha" min="10" max="90" value="45" title="겹쳐 보기 진하기" style="accent-color:var(--sea)">
          <button class="btn small" id="target-load" title="교사 시연용: 목표 단면을 내 캔버스로 복사">내 캔버스로 복사 (시연용)</button>
          <div class="answer" id="target-answer" hidden style="padding:0"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2><span class="n">MY</span>내 지질 단면</h2>
        <label class="chk"><input type="checkbox" id="labels-chk" checked> 지층 기호</label>
        <button class="ib" id="btn-undo" title="되돌리기 (Ctrl+Z)">↶</button>
        <button class="ib" id="btn-redo" title="다시 실행 (Ctrl+Y)">↷</button>
        <button class="ib" id="btn-clear" title="전체 지우기">🗑</button>
      </div>
      <div class="workbench">
        <div id="tabs" role="toolbar" aria-label="지질 작용 도구">
        <button class="tab" data-tool="dep" title="퇴적 (1)"><span class="key">1</span><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 11h24M4 17h24M4 23h24"/><path d="M16 3v5m-3-3 3 3 3-3"/></svg><span>퇴적</span></button>
        <button class="tab" data-tool="fold" title="습곡 (2)"><span class="key">2</span><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 13c4-7 9-7 13 0s9 7 13 0"/><path d="M3 19c4-7 9-7 13 0s9 7 13 0"/><path d="M3 25c4-7 9-7 13 0s9 7 13 0"/></svg><span>습곡</span></button>
        <button class="tab" data-tool="tilt" title="경사 (3)"><span class="key">3</span><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 16 28 8M4 22l24-8M4 28l24-8"/><path d="M22 3a8 8 0 0 1 6 5" stroke-dasharray="2 2.5"/></svg><span>경사</span></button>
        <button class="tab" data-tool="ero" title="침식 (4)"><span class="key">4</span><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 14h24" stroke-dasharray="3 2.5"/><path d="M4 20 28 16M4 26l24-4"/><circle cx="9" cy="11.5" r="1.6" fill="currentColor" stroke="none"/><circle cx="17" cy="11" r="1.3" fill="currentColor" stroke="none"/><circle cx="24" cy="11.5" r="1.6" fill="currentColor" stroke="none"/><path d="M5 6h22" opacity=".45"/></svg><span>침식</span></button>

<script src="examples.js"></script>
<script>
"use strict";
/* =====================================================================
   지질 단면 실험실 — 모든 지질 작용을 '사건 목록'으로 저장하고,
   화면의 각 점을 시간 역순으로 되돌려 어떤 암석인지 계산한다.
   (습곡·경사·단층이 그 이전 모든 지층·관입암에 자연스럽게 적용된다)
   ===================================================================== */
const W = 800, H = 520;

/* ---------- 암석 ---------- */
const ROCKS = {
  sandstone:   {name:'사암',      base:'#efe0a4', ink:'#9c8232', pat:'dots'},
  mudstone:    {name:'이암',      base:'#d8bb9c', ink:'#81604a', pat:'dash'},
  shale:       {name:'셰일',      base:'#b9c0c6', ink:'#55616c', pat:'lines'},
  limestone:   {name:'석회암',    base:'#cfe0e6', ink:'#6a8995', pat:'brick'},
  conglomerate:{name:'역암',      base:'#dcc9a2', ink:'#83683a', pat:'cong'},
  tuff:        {name:'응회암',    base:'#e6d2da', ink:'#916779', pat:'vee'},
  basement:    {name:'기반암',    base:'#aaa59d', ink:'#58544d', pat:'wavy'},
  granite:     {name:'화강암',    base:'#f1bcb0', ink:'#99483c', pat:'plus', ign:1},
  basalt:      {name:'현무암',    base:'#858991', ink:'#363940', pat:'veeS', ign:1},
  gabbro:      {name:'반려암',    base:'#93a48e', ink:'#42503b', pat:'cross', ign:1},
  andesite:    {name:'안산암',    base:'#b6a497', ink:'#5b4b40', pat:'tick', ign:1},
};
const SED = ['sandstone','mudstone','shale','limestone','conglomerate','tuff','basement'];
const IGN = ['granite','basalt','gabbro','andesite'];
function hex(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
for (const k in ROCKS){ const r=ROCKS[k]; r.b=hex(r.base); r.i=hex(r.ink); }
const IGN_TYPES = {dike:'암맥', sill:'암상', bath:'저반', erupt:'분출'};
const isIgn = e => e.t in IGN_TYPES;

/* ---------- 해시 & 무늬 ---------- */
function hsh(i,j,s){
  let h = (Math.imul(i,374761393) + Math.imul(j,668265263) + Math.imul(s,1442695041))|0;
  h = Math.imul(h ^ (h>>>13), 1274126177); h ^= h>>>16;
  return (h>>>0)/4294967296;
}
function frac(v){ return v - Math.floor(v); }
function pat(p,u,v){
  switch(p){
    case 'dots': { const c=7,i=Math.floor(u/c),j=Math.floor(v/c);
      const dx=u-(i+.2+.6*hsh(i,j,1))*c, dy=v-(j+.2+.6*hsh(i,j,2))*c; return dx*dx+dy*dy<1.15; }
    case 'lines': { const r=v/5, row=Math.floor(r); if (r-row>.2) return false;
      return frac((u+row*17)/46) < .86; }
    case 'dash': { const row=Math.floor(v/6); if (v/6-row>.19) return false;
      return frac((u+(row&1)*5)/10) < .55; }
    case 'brick': { const row=Math.floor(v/9); if (v-row*9<1) return true;
      const q=u+(row&1)*9; return q-Math.floor(q/18)*18 < 1; }
    case 'cong': { const c=16,i=Math.floor(u/c),j=Math.floor(v/c);
      const cx=(i+.32+.36*hsh(i,j,1))*c, cy=(j+.35+.3*hsh(i,j,2))*c;
      const rx=3+3.4*hsh(i,j,3), ry=2.4+2*hsh(i,j,4);
      const a=(u-cx)/rx, b=(v-cy)/ry, n=a*a+b*b; return n<=1 && n>.5; }
    case 'vee': case 'veeS': { const c=p==='vee'?11:8, s=p==='vee'?2.6:1.9;
      const i=Math.floor(u/c), j=Math.floor(v/c);
      const lx=u-(i+.5)*c-(hsh(i,j,1)-.5)*2, ly=v-(j+.5)*c;
      if (ly<-s||ly>s) return false; return Math.abs(Math.abs(lx)-(s-ly)*.55) < .62; }
    case 'plus': { const c=12,i=Math.floor(u/c),j=Math.floor(v/c);
      const lx=u-(i+.5)*c-(hsh(i,j,1)-.5)*4, ly=v-(j+.5)*c-(hsh(i,j,2)-.5)*4;
      return (Math.abs(lx)<.7&&Math.abs(ly)<3)||(Math.abs(ly)<.7&&Math.abs(lx)<3); }
    case 'cross': { const c=10,i=Math.floor(u/c),j=Math.floor(v/c);
      const lx=u-(i+.5)*c-(hsh(i,j,1)-.5)*3, ly=v-(j+.5)*c-(hsh(i,j,2)-.5)*3;
      return Math.abs(lx)<2.5 && Math.abs(Math.abs(lx)-Math.abs(ly))<.65; }
    case 'tick': { const c=9,i=Math.floor(u/c),j=Math.floor(v/c);
      const lx=u-(i+.5)*c, ly=v-(j+.5)*c, k=(hsh(i,j,1)-.5)*1.2;
      return Math.abs(lx)<2.6 && Math.abs(ly-k*lx)<.6; }
    case 'wavy': { const w=v+2.4*Math.sin(u/10); return frac(w/7)<.15; }
  }
  return false;
}

/* ---------- 사건 준비(파생값 계산) ---------- */
function prep(e){
  switch(e.t){
    case 'tilt': { const a=e.ang*Math.PI/180; e._c=Math.cos(a); e._s=Math.sin(a); if(e.cx==null){e.cx=W/2;e.cy=H/2;} break; }
    case 'fold': e._k=2*Math.PI/e.wl; break;
    case 'fault': { const dx=e.x2-e.x1, dy=e.y2-e.y1, L=Math.hypot(dx,dy)||1;
      e._dx=dx; e._dy=dy; e._len=L; const tx=dx/L, ty=dy/L;
      e._sy=e.d; e._sx=Math.abs(ty)>1e-3 ? tx*e.d/ty : 0; break; }
    case 'dike': e._vx=e.x2-e.x1; e._vy=e.y2-e.y1; e._l2=e._vx*e._vx+e._vy*e._vy||1; break;
    case 'erupt': e._vx=e.vx-e.x1; e._vy=e.L-e.y1; e._l2=e._vx*e._vx+e._vy*e._vy||1; e.ex2=e.ex1+e.surf.length-1; break;
    case 'bath': e._H=Math.max(60, H+120-e.top); break;
    case 'sill': e.x2=e.x1+e.b.length-1; break;
  }
  return e;
}
const arrAt=(arr,x0,x)=>{ const f=x-x0, i=Math.floor(f); if(i<0) return arr[0]; if(i>=arr.length-1) return arr[arr.length-1]; const t=f-i; return arr[i]*(1-t)+arr[i+1]*t; };
const sillTh=(e,x)=>{ const t=(x-e.x1)/Math.max(1,e.x2-e.x1); return e.th*Math.sqrt(Math.max(0,Math.sin(Math.PI*t))); };
function segD(x,y,ax,ay,vx,vy,l2){ let t=((x-ax)*vx+(y-ay)*vy)/l2; t=t<0?0:t>1?1:t; const dx=x-ax-t*vx, dy=y-ay-t*vy; return Math.sqrt(dx*dx+dy*dy); }

/* ---------- 핵심: 점 평가 (시간 역순) ----------
   반환: 그 점을 차지한 사건 번호(암석), 공기면 -1
   gU,gV: 암석이 만들어질 당시 좌표(무늬용)  gF: 표시 플래그 */
let E = [];
let gU=0,gV=0,gF=0,gEro=-1,gEu=0,gEv=0;
const F_FAULT=1,F_BAKE=2,F_GRAVEL=4,F_GEDGE=8,F_DASH=16;
function unconfMark(){
  const e=E[gEro], m=e.mark||'both';
  if (m==='none') return;
  if ((m==='both'||m==='dash') && gEv<1.5 && (Math.floor(gEu/7)&1)===0) gF|=F_DASH;
  if (m==='both'||m==='gravel'){
    const c=20, i=Math.floor(gEu/c);
    if (hsh(i,gEro,9) < .18) return;
    const cx=i*c+6+8*hsh(i,gEro,1), rx=3.5+3.3*hsh(i,gEro,2), ry=2+1.7*hsh(i,gEro,3);
    const a=(gEu-cx)/rx, b=(gEv-ry*.95)/ry, n=a*a+b*b;
    if (n<=1) gF |= (n>.55 ? F_GEDGE : F_GRAVEL);
  }
}
function ev(k,x,y){
  while (k>=0){
    const e=E[k];
    switch(e.t){
      case 'dep': {
        const r=ev(k-1,x,y);
        if (r<0 && y>=e.level){
          // 부정합 표시는 침식으로 실제로 깎인 면 위에만 (원래 빈 공간이던 곳은 제외)
          if (gEro>=0 && gEv<10){
            const ek=gEro, ex=gEu, evv=gEv;
            const below=ev(ek-1, ex, E[ek].level+.6);
            gF=0; gEro=ek; gEu=ex; gEv=evv;
            if (below>=0) unconfMark();
          }
          gU=x; gV=y; gEro=-1; return k;
        }
        return r;
      }
      case 'ero':
        if (y<e.level){ gEro=k; gEu=x; gEv=e.level-y; return -1; }
        k--; continue;
      case 'fold': y -= e.amp*Math.sin(e._k*(x-e.ph)); k--; continue;
      case 'tilt': { const dx=x-e.cx, dy=y-e.cy; x=e.cx+dx*e._c-dy*e._s; y=e.cy+dx*e._s+dy*e._c; k--; continue; }
      case 'fault': {
        const cr=e._dx*(y-e.y1)-e._dy*(x-e.x1);
        let nx=x, ny=y; if ((cr>0?1:-1)===e.side){ nx-=e._sx; ny-=e._sy; }
        const r=ev(k-1,nx,ny);
        if (r>=0 && Math.abs(cr)/e._len < 1.1) gF|=F_FAULT;
        return r;
      }
      case 'dike': {
        const r=ev(k-1,x,y); if (r<0) return r;
        const d=segD(x,y,e.x1,e.y1,e._vx,e._vy,e._l2);
        if (d<=e.w/2){ gU=x; gV=y; gF=0; return k; }
        if (d<=e.w/2+e.bake) gF|=F_BAKE;
        return r;
      }
      case 'bath': {
        const r=ev(k-1,x,y); if (r<0) return r;
        const q=(x-e.cx)/e.R, f=e.top+e._H*q*q;
        if (y>=f){ gU=x; gV=y; gF=0; return k; }
        if (e.bake>0){ const sl=2*e._H*(x-e.cx)/(e.R*e.R); if ((f-y)/Math.sqrt(1+sl*sl) < e.bake) gF|=F_BAKE; }
        return r;
      }
      case 'sill': {
        if (x<e.x1 || x>e.x2){ k--; continue; }
        const b=arrAt(e.b,e.x1,x), t=sillTh(e,x);
        if (y>=b){ const r=ev(k-1,x,y); if (r>=0 && y-b<e.bake) gF|=F_BAKE; return r; }
        if (y>=b-t){ const r=ev(k-1,x,b-.5); if (r<0) return r; gU=x; gV=y; gF=0; return k; }
        const r=ev(k-1,x,y+t);
        if (r>=0 && (b-t)-y<e.bake) gF|=F_BAKE;
        return r;
      }
      case 'erupt': {
        const r=ev(k-1,x,y);
        const inE = x>=e.ex1 && x<=e.ex2;
        const d=segD(x,y,e.x1,e.y1,e._vx,e._vy,e._l2);
        if (r>=0){
          if (d<=e.w/2){ gU=x; gV=y; gF=0; return k; }
          if (d<=e.w/2+e.bake) gF|=F_BAKE;
          else if (inE && e.bake>0){ const s=arrAt(e.surf,e.ex1,x); if (y>=s && y<s+e.bake) gF|=F_BAKE; }
          return r;
        }
        if (inE && y>=e.L){ gU=x; gV=y; gF=0; gEro=-1; return k; }
        return r;
      }
    }
    k--;
  }
  gEro=-1; return -1;
}
function unitAt(events,x,y){ E=events; gF=0; gEro=-1; return ev(events.length-1,x,y); }

/* 좌표 변환: 사건 k 직후의 좌표 <-> 현재 좌표 (지층 기호 위치 고정용) */
function fwd(events,k,x,y){
  for (let j=k+1;j<events.length;j++){ const e=events[j];
    if (e.t==='fold') y += e.amp*Math.sin(e._k*(x-e.ph));
    else if (e.t==='tilt'){ const dx=x-e.cx, dy=y-e.cy; x=e.cx+dx*e._c+dy*e._s; y=e.cy-dx*e._s+dy*e._c; }
    else if (e.t==='fault'){ const cr=e._dx*(y-e.y1)-e._dy*(x-e.x1); if ((cr>0?1:-1)===e.side){ x+=e._sx; y+=e._sy; } }
    else if (e.t==='sill' && x>=e.x1 && x<=e.x2){ if (y<arrAt(e.b,e.x1,x)) y-=sillTh(e,x); }
  }
  return {x,y};
}
function inv(events,k,x,y){
  for (let j=events.length-1;j>k;j--){ const e=events[j];
    if (e.t==='fold') y -= e.amp*Math.sin(e._k*(x-e.ph));
    else if (e.t==='tilt'){ const dx=x-e.cx, dy=y-e.cy; x=e.cx+dx*e._c-dy*e._s; y=e.cy+dx*e._s+dy*e._c; }
    else if (e.t==='fault'){ const cr=e._dx*(y-e.y1)-e._dy*(x-e.x1); if ((cr>0?1:-1)===e.side){ x-=e._sx; y-=e._sy; } }
    else if (e.t==='sill' && x>=e.x1 && x<=e.x2){ const b=arrAt(e.b,e.x1,x), t=sillTh(e,x); if (y<b-t) y+=t; else if (y<b) y=b-.5; }
  }
  return {x,y};
}
function surfaceAt(events,x){
  E=events; const n=events.length-1;
  let prev=-420;
  for (let y=-420;y<=H+420;y+=3){
    gF=0; gEro=-1;
    if (ev(n,x,y)>=0){
      let a=prev,b=y; for(let i=0;i<7;i++){ const m=(a+b)/2; gF=0; gEro=-1; if (ev(n,x,m)>=0) b=m; else a=m; }
      return b;
    }
    prev=y;
  }
  return null;
}

/* ---------- 이름·기호 ---------- */
function letters(events){
  const m={}; let s=0,g=0; const SL='ABCDEFGHIJKLMNO', GL='PQRSTUVWXYZ';
  events.forEach((e,i)=>{
    if (e.t==='dep'){ m[i]= SL[s%15]+(s>=15?String(Math.floor(s/15)+1):''); s++; }
    else if (isIgn(e)){ m[i]= GL[g%11]+(g>=11?String(Math.floor(g/11)+1):''); g++; }
  });
  return m;
}
function faultKind(e){
  if (!e.d) return '변위 없음';
  if (Math.abs(e._dx) < Math.abs(e._dy)*0.02) return '수직 단층';
  const mx=(e.x1+e.x2)/2, my=(e.y1+e.y2)/2;
  const cr=e._dx*((my-20)-e.y1)-e._dy*(mx-e.x1); const hw = cr>0?1:-1;   // 상반 쪽
  const hwDown = (e.side===hw && e.d>0) || (e.side!==hw && e.d<0);
  return hwDown ? '정단층' : '역단층';
}
function shortName(e,i,L){
  switch(e.t){ case 'dep': return L[i]; case 'fold': return '습곡'; case 'tilt': return '경사';
    case 'ero': return '침식'; case 'fault': return '단층'; default: return L[i]; }
}
function longName(e,i,L){
  switch(e.t){
    case 'dep': return `${L[i]} 퇴적 · ${ROCKS[e.rock].name}`;
    case 'fold': return `습곡 · 진폭 ${Math.round(Math.abs(e.amp))}`;
    case 'tilt': return `경사 · ${e.ang>0?'반시계':'시계'} ${Math.abs(e.ang).toFixed(1)}°`;
    case 'ero': return `침식 (부정합면)`;
    case 'fault': return `단층 · ${faultKind(e)}`;
    default: return `${L[i]} ${IGN_TYPES[e.t]} · ${ROCKS[e.rock].name}`;
  }
}

/* ---------- 렌더링 ---------- */
const SKY_TOP=[214,230,240], SKY_BOT=[236,243,246];
const BND=[47,52,57];
function renderEvents(ctx, events, scale, opt={}){
  E=events; const n=events.length-1;
  const pw=Math.round(W*scale), ph=Math.round(H*scale);
  if (ctx.canvas.width!==pw || ctx.canvas.height!==ph){ ctx.canvas.width=pw; ctx.canvas.height=ph; }
  const img=ctx.createImageData(pw,ph), d=img.data, ids=new Int32Array(pw*ph);
  const ps=opt.patScale||{};
  const rockOf=new Array(events.length);
  for (let i=0;i<events.length;i++){ const r=ROCKS[events[i].rock]; if (r) rockOf[i]={r, s:ps[events[i].rock]||1}; }
  let o=0;
  for (let py=0;py<ph;py++){
    const y=(py+.5)/scale, t=py/ph;
    const sr=SKY_TOP[0]+(SKY_BOT[0]-SKY_TOP[0])*t, sg=SKY_TOP[1]+(SKY_BOT[1]-SKY_TOP[1])*t, sb=SKY_TOP[2]+(SKY_BOT[2]-SKY_TOP[2])*t;
    for (let px=0;px<pw;px++,o++){
      const x=(px+.5)/scale;
      gF=0; gEro=-1;
      const k=n>=0 ? ev(n,x,y) : -1;
      ids[o]=k;
      let R,G,B;
      if (k<0){ R=sr; G=sg; B=sb; }
      else {
        const ro=rockOf[k], rk=ro.r;
        const c = pat(rk.pat, gU/ro.s, gV/ro.s) ? rk.i : rk.b;
        R=c[0]; G=c[1]; B=c[2];
        if (gF){
          if (gF&F_BAKE){ R=R*.62+217*.38; G=G*.62+84*.38; B=B*.62+44*.38;
            if (frac((x-y)/5)<.22){ R=176; G=57; B=27; } }
          if (gF&F_GRAVEL){ R=167; G=158; B=146; }
          if (gF&F_GEDGE){ R=88; G=82; B=74; }
          if (gF&F_DASH){ R=40; G=40; B=40; }
          if (gF&F_FAULT){ R=24; G=24; B=24; }
        }
      }
      const q=o*4; d[q]=R; d[q+1]=G; d[q+2]=B; d[q+3]=255;
    }
  }
  // 경계선
  const thick = scale>=1.5;
  for (let py=0;py<ph;py++){
    for (let px=0;px<pw;px++){
      const i=py*pw+px, a=ids[i];
      let edge = (px<pw-1 && ids[i+1]!==a) || (py<ph-1 && ids[i+pw]!==a);
      if (!edge && thick) edge = (px>0 && ids[i-1]!==a) || (py>0 && ids[i-pw]!==a);
      if (edge){ const q=i*4; d[q]=BND[0]; d[q+1]=BND[1]; d[q+2]=BND[2]; }
    }
  }
  ctx.putImageData(img,0,0);
  return {ids,pw,ph,scale};
}

/* 지층 기호 위치: 각 암체가 가장 두껍게 보이는 곳(가운데 우선) */
function computeLabels(events, res){
  const {ids,pw,ph,scale}=res; const L=letters(events);
  const best={}; const step=Math.max(1,Math.round(4*scale));
  for (let px=Math.round(10*scale); px<pw-10*scale; px+=step){
    let start=0, cur=ids[px];
    for (let py=1;py<=ph;py++){
      const v = py<ph ? ids[py*pw+px] : -999;
      if (v!==cur){
        if (cur>=0 && L[cur]){
          const len=(py-start)/scale, xl=px/scale;
          const score = Math.min(len,46) - Math.abs(xl-W/2)*0.035 + len*0.02;
          if (!best[cur] || score>best[cur].score) best[cur]={score,len,x:xl,y:(start+py)/2/scale};
        }
        start=py; cur=v;
      }
    }
  }
  const out=[];
  for (const k in L){
    const ki=+k, e=events[ki];
    let p=null;
    if (e.lab){ const q=fwd(events,ki,e.lab.x,e.lab.y); if (q.x>=0&&q.x<=W&&q.y>=0&&q.y<=H&&unitAt(events,q.x,q.y)===ki) p=q; }
    if (!p && best[k] && best[k].len>=9) p={x:best[k].x,y:best[k].y};
    out.push({k:ki, text:L[k], x:p?p.x:null, y:p?p.y:null, visible:!!p || !!best[k]});
  }
  return out;
}
function drawLabels(ctx, labels, scale){
  ctx.save(); ctx.scale(scale,scale);
  ctx.font='bold 19px "Times New Roman",Georgia,serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineJoin='round';
  for (const l of labels){ if (l.x==null) continue;
    ctx.lineWidth=4.5; ctx.strokeStyle='rgba(255,255,255,.95)'; ctx.strokeText(l.text,l.x,l.y+1);
    ctx.fillStyle='#1f2429'; ctx.fillText(l.text,l.x,l.y+1); }
  ctx.restore();
}
function answerHTML(events, labels){
  const L=letters(events); const vis={}; labels.forEach(l=>vis[l.k]=l.visible);
  if (!events.length) return '<p class="note">아직 아무 작용도 없어요.</p>';
  const parts=events.map((e,i)=>{
    const nm=shortName(e,i,L);
    const hidden = (L[i] && !vis[i]) ? ' <span class="hid">(침식되어 안 보임)</span>' : '';
    return `<span>${nm}${hidden}</span>`;
  });
  const list=events.map((e,i)=>`<li>${longName(e,i,L)}${(L[i]&&!vis[i])?' — 지금은 침식되어 관찰 불가':''}</li>`).join('');
  return `<div class="seq">${parts.join('<span class="ar">→</span>')}</div><ol>${list}</ol>`;
}

/* =====================================================================
   앱 상태
   ===================================================================== */
const $=s=>document.querySelector(s);
const rockCv=$('#rock'), ovlCv=$('#ovl'), stage=$('#stage'), wrap=$('#wrap');
const rctx=rockCv.getContext('2d'), octx=ovlCv.getContext('2d');
const S = {
  events: [prep({t:'dep', rock:'basement', level:430})],
  patScale: {},
  pending: null,
  tool: 'dep',
  lastIdx: null,          // 이 도구로 방금 만든(아직 수정 가능한) 사건
  sel: null,              // 작업 기록에서 선택한 사건
  labels: true,
  depRock: 'sandstone',
  ign: {type:'dike', rock:'granite', w:16, bake:6, lava:22},
  fold: {amp:45, wl:420, ph:0},
  tilt: {ang:15},
  eroMark: 'both',
  fault: null,            // 그려진 단층면(낙차 정하기 전)
  target: null,           // 현재 예제
};
let lastRes=null, lastLabels=[];

/* ---------- 실행 취소 ---------- */
const hist=[]; let hi=-1;
function snap(){ return JSON.stringify({events:S.events, patScale:S.patScale}, (k,v)=> k[0]==='_'?undefined:v); }
function pushHist(){ const s=snap(); if (hist[hi]===s) return; hist.splice(hi+1); hist.push(s); if (hist.length>101) hist.shift(); hi=hist.length-1; updUndo(); }
function loadSnap(s){ const o=JSON.parse(s); S.events=o.events.map(prep); S.patScale=o.patScale||{}; S.pending=null; S.lastIdx=null; S.sel=null; S.fault=null; refreshAll(); }
function undo(){ if (hi>0){ hi--; loadSnap(hist[hi]); updUndo(); } }
function redo(){ if (hi<hist.length-1){ hi++; loadSnap(hist[hi]); updUndo(); } }
function updUndo(){ $('#btn-undo').disabled = hi<=0; $('#btn-redo').disabled = hi>=hist.length-1; }

/* ---------- 렌더 스케줄 ---------- */
let rafId=0, hiTimer=0, fastScale=1;
const hiScale = () => Math.min(2, Math.max(1, window.devicePixelRatio||1));
function curEvents(){ return S.pending ? S.events.concat([S.pending]) : S.events; }
function draw(scale){
  const evs=curEvents();
  const t0=performance.now();
  lastRes=renderEvents(rctx, evs, scale, {patScale:S.patScale});
  const dt=performance.now()-t0;
  if (scale<=1.01) fastScale = dt>70 ? Math.max(.5, fastScale*.8) : Math.min(1, fastScale*1.1);
  lastLabels=computeLabels(evs, lastRes);
  drawOverlay();
  if (!S.pending) updateAnswer();
}
function requestDraw(fast){
  cancelAnimationFrame(rafId); clearTimeout(hiTimer);
  rafId=requestAnimationFrame(()=>{
    if (fast){ draw(fastScale); hiTimer=setTimeout(()=>draw(hiScale()),220); }
    else draw(hiScale());
  });
}
function drawOverlay(){
  const s=hiScale(), pw=Math.round(W*s), ph=Math.round(H*s);
  if (ovlCv.width!==pw||ovlCv.height!==ph){ ovlCv.width=pw; ovlCv.height=ph; }
  octx.clearRect(0,0,pw,ph);
  if (S.target && $('#overlay-chk').checked && targetCache){
    octx.globalAlpha=$('#overlay-alpha').value/100; octx.drawImage(targetCache,0,0,pw,ph); octx.globalAlpha=1;
  }
  if (S.labels) drawLabels(octx, lastLabels, s);
  // 단층면 미리보기
  const f = S.fault || (gesture && gesture.faultLine);
  if (f){
    octx.save(); octx.scale(s,s);
    const ext=extendLine(f);
    octx.strokeStyle='#c0392b'; octx.lineWidth=2; octx.setLineDash([8,6]);
    octx.beginPath(); octx.moveTo(ext[0],ext[1]); octx.lineTo(ext[2],ext[3]); octx.stroke();
    octx.restore();
  }
  if (gesture && gesture.guide){
    const g=gesture.guide; octx.save(); octx.scale(s,s); octx.strokeStyle='rgba(192,57,43,.8)'; octx.lineWidth=1.5; octx.setLineDash([5,5]);
    octx.beginPath(); octx.moveTo(g[0],g[1]); octx.lineTo(g[2],g[3]); octx.stroke(); octx.restore();
  }
}
function extendLine(f){
  const dx=f.x2-f.x1, dy=f.y2-f.y1, L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L, M=2000;
  return [f.x1-ux*M, f.y1-uy*M, f.x1+ux*M, f.y1+uy*M];
}

/* ---------- 사건 추가/수정 ---------- */
function commit(e){
  S.events.push(prep(e)); S.pending=null; S.lastIdx=S.events.length-1; S.sel=null;
  pushHist(); refreshAll();
}
function refreshAll(){ requestDraw(false); renderTimeline(); renderPanel(); }

/* ---------- 포인터 ---------- */
let gesture=null;
function toLogical(ev){ const r=wrap.getBoundingClientRect(); return {x:(ev.clientX-r.left)*W/r.width, y:(ev.clientY-r.top)*H/r.height}; }
function hitLabel(p){
  if (!S.labels) return null;
  for (const l of lastLabels){ if (l.x!=null && Math.abs(p.x-l.x)<9 && Math.abs(p.y-l.y)<11) return l; }
  return null;
}
stage.addEventListener('pointerdown', ev=>{
  if (ev.button>0) return;
  const p=toLogical(ev);
  const inCanvas = p.x>=0&&p.x<=W&&p.y>=0&&p.y<=H;
  const lab = (inCanvas && S.tool==='dep') ? hitLabel(p) : null;
  stage.setPointerCapture(ev.pointerId);
  if (lab){ gesture={label:lab, start:p}; return; }
  gesture={start:p, last:p};
  TOOLS[S.tool].down?.(p, ev);
  requestDraw(true);
});
stage.addEventListener('pointermove', ev=>{
  if (!gesture) return;
  const p=toLogical(ev); gesture.last=p;
  if (gesture.label){ gesture.label.x=Math.max(8,Math.min(W-8,p.x)); gesture.label.y=Math.max(8,Math.min(H-8,p.y)); drawOverlay(); return; }
  TOOLS[S.tool].move?.(p, ev);
  requestDraw(true);
});
function endGesture(ev, cancel){
  if (!gesture) return;
  const g=gesture, p=ev?toLogical(ev):g.last;
  if (g.label){
    const k=g.label.k, evs=S.events;
    if (unitAt(evs,p.x,p.y)===k){ const q=inv(evs,k,p.x,p.y); evs[k].lab={x:+q.x.toFixed(1),y:+q.y.toFixed(1)}; pushHist(); }
    else toast('지층 기호는 그 지층 안에만 둘 수 있어요');
    gesture=null; requestDraw(false); return;
  }
  if (!cancel) TOOLS[S.tool].up?.(p, ev); else S.pending=null;
  gesture=null;
  requestDraw(false);
}
stage.addEventListener('pointerup', ev=>endGesture(ev,false));
stage.addEventListener('pointercancel', ev=>endGesture(ev,true));
stage.addEventListener('wheel', ev=>{
  const t=TOOLS[S.tool]; if (!t.wheel) return;
  ev.preventDefault(); t.wheel(ev.deltaY<0?1:-1, toLogical(ev));
}, {passive:false});
stage.addEventListener('dblclick', ev=>{
  const p=toLogical(ev); const k=unitAt(S.events,p.x,p.y); if (k<0) return;
  const e=S.events[k];
  // 더블클릭으로 생긴 퇴적 2개를 되돌린 뒤 암석 바꾸기
  if (S.tool==='dep' && dblDeps>0){ const n=Math.min(dblDeps,hi); for(let i=0;i<n;i++){ S.events.pop(); } hist.splice(hi-n+1); hi-=n; dblDeps=0; S.lastIdx=null; }
  const k2=unitAt(S.events,p.x,p.y); if (k2<0) return; const e2=S.events[k2];
  if (!e2.rock) return;
  const list = isIgn(e2) ? IGN : SED;
  e2.rock = list[(list.indexOf(e2.rock)+1)%list.length];
  pushHist(); refreshAll(); toast(`${ROCKS[e2.rock].name}(으)로 바꿨어요`);
});
let dblDeps=0, dblTimer=0;

/* =====================================================================
   도구
   ===================================================================== */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const TOOLS = {
  dep: {
    hint:'캔버스를 클릭한 높이까지 지층이 쌓여요. 누른 채 위·아래로 끌면 두께가 바뀝니다. 방금 쌓은 지층의 윗면을 잡아 끌면 다시 조절할 수 있어요. 지층 기호(A, B…)는 끌어서 옮기고, 지층을 더블클릭하면 암석 종류가 바뀝니다. 휠: 무늬 크기.',
    down(p){
      const last=S.events[S.events.length-1];
      if (S.lastIdx===S.events.length-1 && last && last.t==='dep' && Math.abs(p.y-last.level)<8){ gesture.adjust=last; return; }
      S.pending={t:'dep', rock:S.depRock, level:clamp(p.y,-150,H+60)};
    },
    move(p){
      if (gesture.adjust){ gesture.adjust.level=clamp(p.y,-150,H+60); return; }
      if (S.pending) S.pending.level=clamp(p.y,-150,H+60);
    },
    up(){
      if (gesture.adjust){ pushHist(); renderTimeline(); return; }
      if (!S.pending) return;
      const e=S.pending;

      const nx=SED.filter(r=>r!=='basement'); const i=nx.indexOf(S.depRock);
      S.depRock = nx[(i+1)%nx.length];
      dblDeps++; clearTimeout(dblTimer); dblTimer=setTimeout(()=>dblDeps=0,450);
      renderPanel();
    },
    wheel(dir,p){
      const k=unitAt(S.events,p.x,p.y); if (k<0||!S.events[k].rock) return;
      const r=S.events[k].rock; S.patScale[r]=clamp((S.patScale[r]||1)*(dir>0?1.1:1/1.1),.5,3);
      requestDraw(true); clearTimeout(wheelT); wheelT=setTimeout(pushHist,400);
    }
  },
  fold: {
    hint:'캔버스를 누른 채 위·아래로 끌면 휘어지는 크기(진폭), 좌우로 끌면 습곡 위치가 바뀌어요. 휠로 파장을 바꿀 수 있어요. 아래 슬라이더로 숫자를 정해 적용해도 됩니다.',
    down(p){ const f=S.fold; gesture.ph0=f.ph; S.pending={t:'fold', amp:0, wl:f.wl, ph:f.ph}; prep(S.pending); },
    move(p){ const g=gesture; S.pending.amp=clamp((g.start.y-p.y)*.6,-150,150); S.pending.ph=((g.ph0+(p.x-g.start.x))%S.pending.wl+S.pending.wl)%S.pending.wl; prep(S.pending); },
    up(){ const e=S.pending; if (!e || Math.abs(e.amp)<1){ S.pending=null; return; }
      S.fold.amp=Math.round(e.amp); S.fold.ph=Math.round(e.ph); e.amp=Math.round(e.amp); e.ph=Math.round(e.ph); commit(e); },
    wheel(dir){
      const tgt = S.pending || (S.lastIdx!=null && S.events[S.lastIdx].t==='fold' ? S.events[S.lastIdx] : null);
      S.fold.wl=clamp(Math.round(S.fold.wl*(dir>0?1.08:1/1.08)),120,1200);
      if (tgt){ tgt.wl=S.fold.wl; prep(tgt); requestDraw(true); clearTimeout(wheelT); wheelT=setTimeout(()=>{pushHist();renderTimeline();},400); }
      renderPanel();
    }
  },
  tilt: {
    hint:'캔버스를 누른 채 위로 끌면 반시계 방향, 아래로 끌면 시계 방향으로 기울어요 (최대 ±35°). 손을 떼면 확정됩니다.',
    down(){ S.pending=prep({t:'tilt', ang:0, cx:W/2, cy:H/2}); },
    move(p){ S.pending.ang=+clamp((gesture.start.y-p.y)*.2,-35,35).toFixed(1); prep(S.pending); },
    up(){ const e=S.pending; if (!e||Math.abs(e.ang)<.3){ S.pending=null; return; } S.tilt.ang=e.ang; commit(e); }
  },
  ero: {
    hint:'부정합면 표시 방법을 고른 뒤, 깎아낼 높이를 클릭하세요. 누른 채 위·아래로 끌어 높이를 조절할 수 있고, 손을 떼면 그 위의 암석이 모두 깎여 나갑니다.',
    down(p){ S.pending={t:'ero', level:clamp(p.y,-100,H+40), mark:S.eroMark}; },
    move(p){ if (S.pending) S.pending.level=clamp(p.y,-100,H+40); },
    up(){ if (S.pending) commit(S.pending); }
  },
  ign: {
    get hint(){ return {
      dike:'아래쪽(회색 테두리 포함)에서 시작해 지층 안쪽으로 끌면 암맥이 생겨요. 휠 또는 슬라이더로 폭을 바꿀 수 있어요.',
      sill:'지층 경계 가까이를 누른 채 좌우로 끌면 그 경계를 따라 암상이 들어가요. 위의 지층은 그만큼 밀려 올라갑니다.',
      bath:'저반의 꼭대기가 될 곳을 누르고 바깥쪽으로 끌어 크기를 정하세요.',
      erupt:'마그마가 올라올 시작점(아래쪽)을 누르고 분화구가 될 지표 위치까지 끌면, 관로가 생기고 낮은 곳부터 용암이 덮여요.'
    }[S.ign.type]; },
    down(p){
      const o=S.ign;
      if (o.type==='dike') S.pending=prep({t:'dike', rock:o.rock, x1:p.x,y1:p.y,x2:p.x,y2:p.y-1, w:o.w, bake:o.bake});
      else if (o.type==='bath') S.pending=prep({t:'bath', rock:o.rock, cx:p.x, top:p.y, R:40, bake:o.bake});
      else if (o.type==='sill'){
        const tr=trackBoundary(S.events,p.x,p.y);
        if (!tr){ toast('지층 경계(두 지층이 만나는 선) 가까이를 눌러 주세요'); gesture.dead=true; return; }

      }
      else if (o.type==='erupt'){

      }
    },
    move(p){
      const o=S.ign, g=gesture; if (g.dead) return;

      else if (o.type==='erupt'){ S.pending=makeErupt(g.surf,g.start,p,o); g.guide=[g.start.x,g.start.y,p.x,p.y]; }

    up(){

      if (e.t==='dike' && Math.hypot(e.x2-e.x1,e.y2-e.y1)<12){ S.pending=null; return; }
      if (e.t==='sill' && e.b.length<20){ S.pending=null; toast('좌우로 조금 더 길게 끌어 주세요'); return; }
      commit(e);
    },
    wheel(dir){
      const o=S.ign; o.w=clamp(o.w+(dir>0?2:-2),4,80);
      const tgt = S.pending || (S.lastIdx!=null && isIgn(S.events[S.lastIdx]) ? S.events[S.lastIdx] : null);
      if (tgt){ if (tgt.t==='sill') tgt.th=o.w; else if (tgt.t!=='bath') tgt.w=o.w; prep(tgt); requestDraw(true); clearTimeout(wheelT); wheelT=setTimeout(pushHist,400); }
      renderPanel();
    }
  },
  fault: {
    get hint(){ return S.fault
      ? '이제 움직일 쪽의 지괴를 누른 채 위·아래로 끌어 낙차를 정하세요. 손을 떼면 확정됩니다. (Esc: 취소)'
      : '회색 테두리 쪽에서 시작해 단면을 가로질러 비스듬히 끌어 단층면을 그리세요. 그다음 움직일 지괴를 위·아래로 끌면 됩니다.'; },
    down(p){
      if (!S.fault){ gesture.faultLine={x1:p.x,y1:p.y,x2:p.x,y2:p.y}; return; }
      const f=S.fault, cr=(f.x2-f.x1)*(p.y-f.y1)-(f.y2-f.y1)*(p.x-f.x1);
      S.pending=prep({t:'fault', x1:f.x1,y1:f.y1,x2:f.x2,y2:f.y2, side:cr>0?1:-1, d:0});
    },
    move(p){
      if (gesture.faultLine){ gesture.faultLine.x2=p.x; gesture.faultLine.y2=p.y; return; }

    },
    up(){
      const fl=gesture.faultLine;
      if (fl){
        const dx=fl.x2-fl.x1, dy=fl.y2-fl.y1, L=Math.hypot(dx,dy);

        if (Math.abs(dy)/L < Math.sin(15*Math.PI/180)){ toast('단층면이 너무 눕혀져 있어요. 더 가파르게 그려 주세요'); return; }
        S.fault={x1:fl.x1,y1:fl.y1,x2:fl.x2,y2:fl.y2}; renderPanel(); updHint(); return;
      }
      if (S.pending){ if (S.pending.d===0){ S.pending=null; return; } S.fault=null; commit(S.pending); updHint(); }
    }
  }
};
let wheelT=0;

/* 암상: 누른 곳 근처의 지층 경계를 좌우로 추적 */
function trackBoundary(events,x0,y0){
  E=events; const n=events.length-1;
  const U=(x,y)=>{ gF=0; gEro=-1; return ev(n,x,y); };
  let best=null;
  for (let dy=0; dy<=26; dy+=.5){
    for (const s of [1,-1]){ const y=y0+dy*s; const a=U(x0,y-.5), b=U(x0,y+.5);
      if (a!==b && a>=0 && b>=0){ best={y, a, b}; break; } }
    if (best) break;
  }
  if (!best) return null;
  const find=(x,yp)=>{ for (let dy=0; dy<=9; dy+=.5){ for (const s of [1,-1]){ const y=yp+dy*s;
      if (U(x,y-.5)===best.a && U(x,y+.5)===best.b){ let lo=y-.5, hi=y+.5; for(let i=0;i<4;i++){const m=(lo+hi)/2; if(U(x,m)===best.a) lo=m; else hi=m;} return (lo+hi)/2; } } } return null; };
  const map=new Map(); map.set(Math.round(x0), best.y);
  let y=best.y; for (let x=Math.round(x0)+1; x<=W+40; x++){ const r=find(x,y); if (r==null) break; map.set(x,r); y=r; }
  y=best.y; for (let x=Math.round(x0)-1; x>=-40; x--){ const r=find(x,y); if (r==null) break; map.set(x,r); y=r; }
  return map;
}
function makeSill(track,xa,xb,o){
  let x1=Math.round(Math.min(xa,xb)), x2=Math.round(Math.max(xa,xb));
  while (x1<x2 && !track.has(x1)) x1++;
  const b=[]; for (let x=x1;x<=x2;x++){ if (!track.has(x)) break; b.push(+track.get(x).toFixed(1)); }
  return prep({t:'sill', rock:o.rock, x1, b, th:o.w, bake:o.bake});
}
function makeErupt(surf,s,p,o){
  const X0=-60, vx=Math.round(clamp(p.x,-40,W+40)), s0=surf[vx-X0];
  if (s0==null) return null;
  const L=s0-o.lava;
  let a=vx, b=vx;
  while (a-1-X0>=0 && surf[a-1-X0]!=null && surf[a-1-X0]>L && vx-a<260) a--;
  while (b+1-X0<surf.length && surf[b+1-X0]!=null && surf[b+1-X0]>L && b-vx<260) b++;
  const ss=[]; for (let x=a;x<=b;x++) ss.push(+surf[x-X0].toFixed(1));
  return prep({t:'erupt', rock:o.rock, x1:s.x, y1:Math.max(s.y,s0+10), vx, L:+L.toFixed(1), w:o.w, bake:o.bake, ex1:a, surf:ss, lava:o.lava});
}

const panel=$('#panel');
function el(tag,attrs={},html=''){ const e=document.createElement(tag); for (const k in attrs){ if (k==='on') for(const t in attrs.on) e.addEventListener(t,attrs.on[t]); else e.setAttribute(k,attrs[k]); } if (html) e.innerHTML=html; return e; }
function rockSelect(list,val,onch){
  const f=el('div',{class:'field'}); f.append(el('label',{},'암석'));
  const s=el('select'); list.forEach(r=>{ const o=el('option',{value:r}); o.textContent=ROCKS[r].name; if (r===val) o.selected=true; s.append(o); });
  const sw=el('span',{class:'swatch'}); sw.style.background=ROCKS[val].base;
  s.addEventListener('change',()=>{ sw.style.background=ROCKS[s.value].base; onch(s.value); });
  const row=el('div',{class:'row'}); row.style.flexWrap='nowrap'; row.append(sw,s); s.style.flex='1';
  f.append(row); return f;
}
function slider(name,min,max,step,val,unit,onInput,onChange){
  const w=el('div',{class:'slider'});
  const v=el('span',{class:'sl-val'}); const fmt=x=>`${(+x).toFixed(step<1?1:0)}${unit||''}`; v.textContent=fmt(val);
  const r=el('input',{type:'range',min,max,step,value:val});
  r.addEventListener('input',()=>{ v.textContent=fmt(r.value); onInput(+r.value); });
  r.addEventListener('change',()=>onChange&&onChange(+r.value));
  w.append(el('span',{class:'sl-name'},name),v,r); return w;
}
function seg(options,val,onch){
  const s=el('div',{class:'seg'});
  for (const [k,label] of options){ const b=el('button',{type:'button'},label); if (k===val) b.classList.add('on');
    b.addEventListener('click',()=>{ s.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); onch(k); }); s.append(b); }
  return s;
}
function lastOf(type){ const i=S.lastIdx; if (i==null) return null; const e=S.events[i]; return (e && (type==='ign'?isIgn(e):e.t===type)) ? e : null; }

function recomputeErupt(k,lava,live){
  const e=S.events[k]; const before=S.events.slice(0,k);
  const surf=[]; for (let x=-60;x<=W+60;x++) surf.push(surfaceAt(before,x));
  const ne=makeErupt(surf,{x:e.x1,y:e.y1},{x:e.vx,y:0},{rock:e.rock,w:e.w,bake:e.bake,lava});
  if (ne){ ne.lab=e.lab; S.events[k]=ne; if (S.lastIdx===k) S.lastIdx=k; }
  requestDraw(live);
}

function setTool(t){
  if (S.tool!==t){ S.lastIdx=null; S.fault=null; S.pending=null; }
  S.tool=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));
  renderPanel(); updHint(); requestDraw(false);
}

function renderTimeline(){
  const ul=$('#tl'); ul.innerHTML=''; const L=letters(S.events);
  $('#tl-count').textContent=S.events.length;
  S.events.forEach((e,i)=>{
    const li=el('li'); if (S.sel===i) li.classList.add('sel');
    const sw = e.rock ? `<span class="swatch" style="background:${ROCKS[e.rock].base}"></span>` : '';
    li.innerHTML=`<span class="no">${i+1}</span><span class="nm">${sw}${longName(e,i,L)}</span>`;
    const x=el('button',{class:'x',title:'이 작업 삭제',type:'button'},'✕');
    x.addEventListener('click',ev=>{ ev.stopPropagation(); S.events.splice(i,1); S.sel=null; S.lastIdx=null; pushHist(); refreshAll(); });
    li.append(x);
    li.addEventListener('click',()=>{ S.sel = S.sel===i?null:i; renderTimeline(); });
    ul.append(li);
  });
  renderEditor();
}
function renderEditor(){
  const box=$('#editor'); box.innerHTML='';
  if (S.sel==null || !S.events[S.sel]){ box.hidden=true; return; }
  box.hidden=false; const i=S.sel, e=S.events[i], L=letters(S.events);
  box.append(el('div',{class:'flabel'},`${i+1}. ${longName(e,i,L)} — 값 바꾸기`));
  const sl=(name,key,min,max,step,unit)=>box.append(slider(name,min,max,step,e[key],unit,v=>liveEdit(e,key,v),()=>{editDone();}));
  if (e.rock) box.append(rockSelect(isIgn(e)?IGN:SED,e.rock,v=>{ e.rock=v; editDone(); }));
  switch(e.t){
    case 'dep': sl('윗면 높이 (작을수록 위)','level',-150,H+60,1,''); break;
    case 'fold': sl('진폭','amp',-150,150,1,''); sl('파장','wl',120,1200,10,''); sl('위치','ph',0,1200,5,''); break;
    case 'tilt': sl('기울기','ang',-35,35,.5,'°'); break;
    case 'ero': sl('침식 높이 (작을수록 위)','level',-100,H+40,1,'');
      box.append(seg(MARKS,e.mark||'both',v=>{ e.mark=v; editDone(); })); break;
    case 'fault': sl('낙차','d',-260,260,1,''); break;
    case 'dike': sl('관로 폭','w',4,80,1,''); sl('접촉 변성대 폭','bake',0,24,1,''); break;
    case 'sill': sl('암상 두께','th',4,80,1,''); sl('접촉 변성대 폭','bake',0,24,1,''); break;
    case 'bath': sl('크기','R',25,500,1,''); sl('꼭대기 높이','top',-50,H,1,''); sl('접촉 변성대 폭','bake',0,24,1,''); break;
    case 'erupt': sl('관로 폭','w',4,80,1,''); sl('접촉 변성대 폭','bake',0,24,1,'');
      box.append(slider('용암층 두께',6,80,1,e.lava||22,'',v=>recomputeErupt(i,v,true),()=>editDone())); break;
  }
  const row=el('div',{class:'row'});
  if (e.lab) row.append(el('button',{class:'btn small',type:'button',on:{click:()=>{ delete e.lab; editDone(); }}},'기호 위치 자동으로'));
  row.append(el('button',{class:'btn small danger',type:'button',on:{click:()=>{ S.events.splice(i,1); S.sel=null; S.lastIdx=null; pushHist(); refreshAll(); }}},'이 작업 삭제'));
  box.append(row);
  box.append(el('p',{class:'note'},'앞선 작업을 바꾸면 그 뒤의 습곡·단층 등이 자동으로 다시 적용돼요.'));
}

document.addEventListener('keydown',e=>{
  if (e.target.matches('input[type=text],textarea')) return;
  const mod=e.ctrlKey||e.metaKey;
  if (mod && e.key.toLowerCase()==='z' && !e.shiftKey){ e.preventDefault(); undo(); }
  else if (mod && (e.key.toLowerCase()==='y' || (e.key.toLowerCase()==='z'&&e.shiftKey))){ e.preventDefault(); redo(); }
  else if (e.key==='Escape'){ if (gesture) endGesture(null,true); S.fault=null; S.pending=null; renderPanel(); updHint(); requestDraw(false); closeModal(); }
});

function cleanEvents(evs){ return JSON.parse(JSON.stringify(evs,(k,v)=> k[0]==='_'?undefined:(typeof v==='number'?Math.round(v*10)/10:v))); }
function download(name,blob){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.append(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }

function renderThumb(canvas,events,scale){
  const ctx=canvas.getContext('2d'); const evs=events.map(e=>prep({...e}));
  const res=renderEvents(ctx,evs,scale,{}); drawLabels(ctx,computeLabels(evs,res),scale); return evs;
}
function setTarget(ex){
  S.target=ex; const card=$('#target-card'); card.hidden=false;
  $('#target-title').textContent=ex.title||'예제'; $('#target-desc').textContent=ex.description||'';
  $('#target-desc').hidden=!ex.description;
  const cv=$('#target-canvas'); const evs=renderThumb(cv,ex.events,hiScale());
  targetCache=document.createElement('canvas'); renderEvents(targetCache.getContext('2d'),evs,1,{});
  const ta=$('#target-answer'); ta.hidden=true; $('#target-answer-btn').textContent='정답 순서 보기';
  const labs=computeLabels(evs,renderEvents(document.createElement('canvas').getContext('2d'),evs,.5,{}));
  ta.innerHTML=answerHTML(evs,labs);
  S.targetEvents=evs;
  card.scrollIntoView({behavior:'smooth',block:'start'});
  try{ const u=new URL(location.href); if (ex.id && ex.id!=='current'){ u.searchParams.set('ex',ex.id); history.replaceState(null,'',u); } }catch(_){}
  drawOverlay();
}
$('#target-close').onclick=()=>{ S.target=null; $('#target-card').hidden=true; $('#overlay-chk').checked=false; drawOverlay();
  try{ const u=new URL(location.href); u.searchParams.delete('ex'); history.replaceState(null,'',u);}catch(_){} };
$('#target-answer-btn').onclick=()=>{ const ta=$('#target-answer'); ta.hidden=!ta.hidden; $('#target-answer-btn').textContent=ta.hidden?'정답 순서 보기':'정답 숨기기'; };
$('#overlay-chk').onchange=drawOverlay; $('#overlay-alpha').oninput=drawOverlay;
$('#target-load').onclick=()=>{ if (!S.target) return; if (!confirm('내 캔버스를 목표 단면으로 바꿀까요? (되돌리기 가능)')) return;
  S.events=S.target.events.map(e=>prep(JSON.parse(JSON.stringify(e)))); S.lastIdx=null; S.sel=null; pushHist(); refreshAll(); };
$('#btn-examples').onclick=()=>{
  const box=el('div');
  if (!EXAMPLES.length){ box.append(el('p',{class:'note'},'등록된 예제가 없어요. 「파일 → 예제 코드 만들기」로 만든 코드를 examples.js에 붙여 넣으세요.')); openModal('예제',box); return; }
  const grid=el('div',{class:'ex-grid'});
  EXAMPLES.forEach(ex=>{
    const b=el('button',{class:'ex-item',type:'button'}); const cv=el('canvas');
    b.append(cv, el('div',{class:'t'}), el('div',{class:'d'}));
    b.querySelector('.t').textContent=ex.title||ex.id; b.querySelector('.d').textContent=ex.description||'';
    b.onclick=()=>{ closeModal(); setTarget(ex); };
    grid.append(b);
    setTimeout(()=>renderThumb(cv,ex.events,.4),0);
  });
  box.append(el('p',{class:'note',style:'margin-bottom:12px'},'예제를 고르면 위쪽에 <b>목표 단면</b>이 나타나요. 보면서 아래 내 캔버스에 똑같이 만들어 보세요!'));
  box.append(grid); openModal('예제 고르기',box);
};

/* ---------- 시작 ---------- */
window.addEventListener('resize',()=>requestDraw(false));
pushHist(); setTool('dep'); renderTimeline();
(function(){ try{ const id=new URL(location.href).searchParams.get('ex'); const ex=EXAMPLES.find(x=>x.id===id); if (ex) setTarget(ex); }catch(_){} })();
if (window.GEO_TITLE){ $('#app-title').textContent=window.GEO_TITLE; document.title=window.GEO_TITLE; }
</script>
<script>
/* 도구 막대: 선택한 도구 이름·아이콘 표시, 숫자키 1~6으로 도구 전환 */
(function(){
  const bar=document.getElementById('tabs');
  const show=()=>{ const on=bar.querySelector('.tab.on'); if(!on) return;
    document.getElementById('tool-name').textContent=on.lastElementChild.textContent+' 설정';
    document.getElementById('tool-ic').innerHTML=on.querySelector('svg').outerHTML; };
  bar.addEventListener('click',()=>setTimeout(show,0));
  document.addEventListener('keydown',e=>{
    if (e.ctrlKey||e.metaKey||e.altKey||e.target.matches('input,textarea,select')) return;
    const b=bar.querySelectorAll('.tab')[+e.key-1]; if (b && /^[1-6]$/.test(e.key)) b.click();
  });
  show();
})();
</script>
